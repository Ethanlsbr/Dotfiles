# Password check for the Quickshell lockscreen (PamContext).
# Same faillock accounting as /etc/pam.d/system-auth: `deny` failures within
# `fail_interval` lock the account for `unlock_time` (/etc/security/
# faillock.conf), shared with hyprlock, sudo and login. The tally file
# /run/faillock/$USER is owned by the user, so this works unprivileged.
auth required                   pam_faillock.so preauth
auth [success=1 default=bad]    pam_unix.so
auth [default=die]              pam_faillock.so authfail
auth required                   pam_faillock.so authsucc
