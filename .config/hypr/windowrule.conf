# Opacity
# windowrule = match:class code, opacity 0.8 0.8
# windowrule = match:class spotify, opacity 0.8 0.8

# Float window by default
windowrule = match:class blueman-manager, float 1
windowrule = match:class org.pulseaudio.pavucontrol, float 1
windowrule = match:class org.gnome.Nautilus, float 1

# Size rules
windowrule = match:class blueman-manager, size 1000 600
windowrule = match:class kitty, size 1000 600
windowrule = match:class org.gnome.Nautilus, size 1400 800
windowrule = match:class org.pulseaudio.pavucontrol, size 1000 600
