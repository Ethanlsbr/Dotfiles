general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh   # dbus/sysd lock command (loginctl lock-session); Quickshell lockscreen
    before_sleep_cmd = loginctl lock-session    # lock before sleep (runs lock_cmd)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'  # wake the screens after sleep
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle inhibitors
}
