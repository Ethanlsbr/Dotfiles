general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh   # dbus/sysd lock command (loginctl lock-session); Quickshell lockscreen, hyprlock as fallback
    before_sleep_cmd = timeout 1 qs ipc call lock sleep; loginctl lock-session    # back to the lockscreen's clock so the prompt can't flash on resume, then lock before sleep (runs lock_cmd)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'; qs ipc call lock wake  # wake the screens, restart the lockscreen's fingerprint scan
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle inhibitors
    inhibit_sleep = 3                       # hold off sleep until the session is actually locked (Hyprland lock-notify); auto mode only does this for hyprlock
}
