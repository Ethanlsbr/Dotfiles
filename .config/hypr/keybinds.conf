$scriptsDir = $HOME/.config/hypr/scripts
$mainMod = SUPER
$term = kitty
$volume = $scriptsDir/volume_ctl.sh
$brightness = $scriptsDir/brightness_ctl.sh
$media = $scriptsDir/media_ctl.sh
$screenshot = hyprshot -m region -o ~/Pictures/Screenshots
$logout = killall -9 wlogout || wlogout
$files = nautilus
$browser = zen-browser
$waybarReload =$scriptsDir/waybar_reload.sh

# SCREENSHOTS
bind = $mainMod SHIFT, S, exec, $screenshot
binde = , Print, exec, $screenshot

# MISC
bind = $mainMod, Q, exec, $term
bind = $mainMod, D, exec, $files
bind = $mainMod, W, exec, $browser
bind = $mainMod, L, exec, $logout
bind = $mainMod, M, exec, waypaper
bind = $mainMod, Space, exec, killall -9 rofi || rofi -show drun
bind = $mainMod SHIFT, W, exec, $waybarReload # Reload waybar
bind = $mainMod, H, exec, killall -SIGUSR1 waybar # Hide waybar

# NOTIFICATION
bind= $mainMod, N, exec, swaync-client -t -sw

# BRIGHTNESS
binde = , XF86MonBrightnessDown, exec, $brightness --dec
binde = , XF86MonBrightnessUp, exec, $brightness --inc

# VOLUME
binde = , XF86AudioRaiseVolume, exec, $volume --inc
binde = , XF86AudioLowerVolume, exec, $volume --dec
binde = , XF86AudioMute, exec, $volume --toggle
binde = , XF86AudioMicMute, exec, pamixer --default-source -t

# MEDIA
binde = , XF86AudioPlay, exec, $media --pause

# WINDOW MANAGMENT
bind = $mainMod, C, killactive
bind = $mainMod, S, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo
bind = $mainMod SHIFT, right, resizeactive, 100 0
bind = $mainMod SHIFT, left, resizeactive, -100 0
bind = $mainMod SHIFT, up, resizeactive, 0 -100
bind = $mainMod SHIFT, down, resizeactive, 0 100

# Alt tab
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop

# Expo overview
bind = $mainMod, Tab, hyprexpo:expo, toggle

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move Window
bind = ALT, left, swapwindow, l
bind = ALT, right, swapwindow, r
# bind = ALT, up, swapwindow, u
# bind = ALT, down, swapwindow, d

# Switch
bind = $mainMod, a, workspace, 1
bind = $mainMod, z, workspace, 2
bind = $mainMod, e, workspace, 3
bind = $mainMod, r, workspace, 4
bind = $mainMod, t, workspace, 5
bind = $mainMod, y, workspace, 6
bind = $mainMod, u, workspace, 7

# Move
bind = ALT, a, movetoworkspace, 1
bind = ALT, z, movetoworkspace, 2
bind = ALT, e, movetoworkspace, 3
bind = ALT, r, movetoworkspace, 4
bind = ALT, t, movetoworkspace, 5
bind = ALT, y, movetoworkspace, 6
bind = ALT, u, movetoworkspace, 7

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# clipboard history
bind = SUPER, V, exec, cliphist list | rofi -dmenu -display-columns 2 -p " Search Clipboard:" | cliphist decode | wl-copy
